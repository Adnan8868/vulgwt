        function displayTabContent(items) {
            const target = document.getElementById('vault-cards-target');
            const bulkPanel = document.getElementById('bulk-actions-panel');
            currentRenderedItems = items;

            document.getElementById('dynamic-count-text').innerText = `${items.length} Folders`;

            if (items.length === 0) {
                bulkPanel.classList.add('hidden');
                target.innerHTML = `<div class="text-center py-10 bg-white dark:bg-slate-900 border rounded-xl text-xs">No folders found.</div>`;
                return;
            }

            bulkPanel.classList.remove('hidden');

            target.innerHTML = items.map((item, index) => `
                <div class="vault-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-xl shadow-xs space-y-3">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 rounded-lg flex items-center justify-center text-blue-600 bg-blue-50 dark:bg-slate-800 shrink-0">
                                <i class="fa-solid fa-folder-open"></i>
                            </div>
                            <div class="min-w-0">
                                <span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded font-semibold text-[9px] uppercase">${item.badge}</span>
                                <h3 class="text-xs md:text-sm font-semibold text-slate-900 dark:text-white truncate mt-1">${item.name}</h3>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                            <button onclick="copySingleResource(this, '${btoa(encodeURIComponent(item.name))}', '${item.url}')"

                                <i class="fa-regular fa-copy text-xs"></i> <span>Copy</span>
                            </button>
                            <button onclick="scanFolderContent('${item.url}', 'files-container-${index}')" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-xs uppercase flex items-center gap-1.5 shadow-sm">

                            </button>
                            <a href="${item.url}" target="_blank" class="px-3.5 py-2 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-lg text-xs uppercase flex items-center gap-1">

                            </a>

                    </div>

                    <!-- Hidden container where scanned files will load -->
                    <div id="files-container-${index}" class="hidden pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2"></div>
                </div>

        // Single Row Copy Engine with Channel Link
        function copySingleResource(btnElement, encodedName, url) {
            const decodedName = decodeURIComponent(atob(encodedName));
            let formattedText = `📁 *${decodedName}*\n🔗 Link: ${url}\n\n`;
            formattedText += `📢 *Join WhatsApp Channel for Live VU Help:* \n👉 https://whatsapp.com/channel/0029VbAfKscEVccSHYySNP3I\n\n`;
            formattedText += `VU Study LGWT Official`;

            navigator.clipboard.writeText(formattedText).then(() => {
                const originalContent = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i> <span>Copied!</span>`;
                btnElement.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-700');

                setTimeout(() => {
                    btnElement.innerHTML = originalContent;
                    btnElement.classList.remove('bg-emerald-50', 'border-emerald-300', 'text-emerald-700');
                }, 1500);
            });
        }

        // Bulk Message Compilation
        function compileBulkMessage() {
            if (!currentRenderedItems || currentRenderedItems.length === 0) return "";

            let sectionHeaderName = tabNamesMapping[currentActiveTab].toUpperCase();
            let textMessageBlock = `🎓 *VU STUDY LGWT RESOURCE VAULT* 🎓\n`;
            textMessageBlock += `━━━━━━━━━━━━━━━━━━━━━\n`;
            textMessageBlock += `📂 *CATEGORY: ${sectionHeaderName}*\n`;
            textMessageBlock += `🔢 Total Links: ${currentRenderedItems.length}\n`;
            textMessageBlock += `━━━━━━━━━━━━━━━━━━━━━\n\n`;

            currentRenderedItems.forEach((item, index) => {
                textMessageBlock += `${index + 1}. *${item.name}*\n`;
                textMessageBlock += `🔗 ${item.url}\n`;
                textMessageBlock += `-------------------------------------\n`;
            });

            textMessageBlock += `\n📢 *FOR LATEST VU UPDATES & LIVE HELP* \n`;
            textMessageBlock += `🟢 *Join Our WhatsApp Channel:* \n`;
            textMessageBlock += `🔗 https://whatsapp.com/channel/0029VbAfKscEVccSHYySNP3I\n`;
            textMessageBlock += `━━━━━━━━━━━━━━━━━━━━━\n`;
            textMessageBlock += `🚀 *Prepared with Team LGWT!*`;
            return textMessageBlock;
        }

        function handleBulkAction(actionType) {
            const compiledMessageText = compileBulkMessage();
            if (!compiledMessageText) return;

            if (actionType === 'copy') {
                navigator.clipboard.writeText(compiledMessageText).then(() => {
                    const copyMasterBtn = document.getElementById('master-bulk-copy-btn');
                    const originalBtnHtml = copyMasterBtn.innerHTML;

                    copyMasterBtn.innerHTML = `<i class="fa-solid fa-square-check text-emerald-600"></i> List Copied!`;
                    copyMasterBtn.classList.add('bg-emerald-50', 'text-emerald-900', 'border-emerald-300');

                    setTimeout(() => {
                        copyMasterBtn.innerHTML = originalBtnHtml;
                        copyMasterBtn.classList.remove('bg-emerald-50', 'text-emerald-900', 'border-emerald-300');
                    }, 2000);
                });
            } else if (actionType === 'whatsapp') {
                const whatsappGatewayUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(compiledMessageText)}`;
                window.open(whatsappGatewayUrl, '_blank');
            }
        }

        // Live Scanner function for specific folder card
        function scanFolderContent(folderUrl, containerId) {
            const container = document.getElementById(containerId);
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="text-center py-4 text-emerald-600 text-xs font-bold">
                    <i class="fa-solid fa-sync animate-spin mr-1"></i> Scanning folder files, please wait...
                </div>`;

            fetch(`${SCANNER_API_URL}?folderUrl=${encodeURIComponent(folderUrl)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error || !data.files || data.files.length === 0) {
                        container.innerHTML = `
                            <div class="text-center py-3 text-slate-400 text-xs font-medium space-y-2">
                                <div>Folder is empty or restriction issue.</div>
                                <a href="${folderUrl}" target="_blank" class="px-3 py-1 bg-blue-600 text-white rounded text-xs font-bold inline-block">Open in Google Drive</a>
                            </div>`;
                        return;
                    }

                    container.dataset.files = JSON.stringify(data.files);
                    renderFileList(container, data.files, folderUrl);
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="text-center py-3 text-red-500 text-xs font-bold space-y-2">
                            <div>Scan failed due to network or CORS.</div>
                            <a href="${folderUrl}" target="_blank" class="px-3 py-1 bg-red-600 text-white rounded text-xs font-bold inline-block">Open Drive Directly</a>
                        </div>`;
                });
        }

        function renderFileList(container, files, folderUrl) {
            let html = `
                <div class="mb-2 flex items-center justify-between">
                    <span class="text-[11px] font-bold text-slate-500 uppercase">Found ${files.length} Files:</span>
                    <input type="text" oninput="filterScannedFiles(this, '${container.id}')" placeholder="Filter files inside this folder..." class="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs border border-slate-200 dark:border-slate-700 w-1/2 focus:outline-none">
                </div>
                <div class="max-h-60 overflow-y-auto space-y-1.5 pr-1 file-list-box">`;

            files.forEach(file => {
                let cleanName = file.name.replace(/\.(pdf|docx|doc|zip|rar)$/i, "").trim();
                let directDownload = `https://drive.google.com/uc?export=download&id=${file.id}`;

                html += `
                    <div class="flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-800/60 rounded-lg text-xs border border-slate-200/50 dark:border-slate-700/50">
                        <span class="font-semibold truncate pr-2 text-slate-800 dark:text-slate-200">${cleanName}</span>
                        <div class="flex gap-2 shrink-0">
                            <a href="${file.url}" target="_blank" class="px-2.5 py-1 bg-white dark:bg-slate-900 text-blue-600 rounded text-[10px] font-bold border">View</a>
                            <a href="${directDownload}" target="_blank" class="px-2.5 py-1 bg-emerald-600 text-white rounded text-[10px] font-bold">Download</a>
                        </div>
                    </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function filterScannedFiles(inputElem, containerId) {
            const query = inputElem.value.toLowerCase();
            const container = document.getElementById(containerId);
            const allFiles = JSON.parse(container.dataset.files || '[]');

            const filtered = allFiles.filter(f => f.name.toLowerCase().includes(query));
            const fileListBox = container.querySelector('.file-list-box');

            if (filtered.length === 0) {
                fileListBox.innerHTML = `<div class="text-center py-2 text-xs text-slate-400">No matching file found.</div>`;
                return;
            }

            fileListBox.innerHTML = filtered.map(file => {
                let cleanName = file.name.replace(/\.(pdf|docx|doc|zip|rar)$/i, "").trim();
                let directDownload = `https://drive.google.com/uc?export=download&id=${file.id}`;
                return `
                    <div class="flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-800/60 rounded-lg text-xs border border-slate-200/50 dark:border-slate-700/50">
                        <span class="font-semibold truncate pr-2 text-slate-800 dark:text-slate-200">${cleanName}</span>
                        <div class="flex gap-2 shrink-0">
                            <a href="${file.url}" target="_blank" class="px-2.5 py-1 bg-white dark:bg-slate-900 text-blue-600 rounded text-[10px] font-bold border">View</a>
                            <a href="${directDownload}" target="_blank" class="px-2.5 py-1 bg-emerald-600 text-white rounded text-[10px] font-bold">Download</a>
                        </div>
                    </div>`;
            }).join('');
        }

        function switchTab(tabKey) {
            currentActiveTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-btn-${tabKey}`).classList.add('active');
            document.getElementById('vault-search').value = '';
            displayTabContent(mainVaultData[tabKey]);
        }

        function filterVault() {
            const query = document.getElementById('vault-search').value.toLowerCase().trim();
            if (!query) {
                displayTabContent(mainVaultData[currentActiveTab]);
                return;
            }
            let allFolders = [];
            for (const key in mainVaultData) {
                mainVaultData[key].forEach(el => allFolders.push(el));
            }
            const filtered = allFolders.filter(item => item.name.toLowerCase().includes(query));
            displayTabContent(filtered);
        }

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            }
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }
        function updateThemeUI(isDark) {
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-moon text-yellow-300' : 'fa-solid fa-sun text-amber-500';
            document.getElementById('themeText').innerText = isDark ? 'Dark' : 'Light';
        }

        window.onload = () => {
            initTheme();
            displayTabContent(mainVaultData['mid']);
        };
    </script>
</body>

</html>
