        // Core Render Engine
        function displayTabContent(items, isGlobalSearch = false) {
            const target = document.getElementById('vault-cards-target');
            const counter = document.getElementById('counter-badge');
            const dynamicCountText = document.getElementById('dynamic-count-text');
            const bulkPanel = document.getElementById('bulk-actions-panel');
            
            currentRenderedItems = items; 
            const countString = `${items.length} Folders`;
            counter.innerText = countString;
            dynamicCountText.innerText = countString;

            if (items.length === 0) {
                bulkPanel.classList.add('hidden'); 
                target.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-800 rounded-2xl shadow-xs">
                        <div class="w-10 h-10 bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 rounded-full flex items-center justify-center text-base mx-auto mb-2">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <p class="text-xs font-semibold text-slate-600 dark:text-slate-400">No resources found matching search</p>
                    </div>
                `;
                return;
            }

            bulkPanel.classList.remove('hidden');
            document.getElementById('bulk-panel-desc').innerText = isGlobalSearch 
                ? `Copy or share all ${items.length} filtered search matching items instantly.`
                : `Copy or share all ${items.length} folders of ${tabNamesMapping[currentActiveTab]} category.`;

            target.innerHTML = items.map((item, index) => `
                <div class="vault-card bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-3.5 md:p-4 rounded-xl flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between shadow-xs">

                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-1.5 mb-1">

                                    ${item.badge}
                                </span>
                                ${isGlobalSearch && item.originTab ? `
                                    <span class="bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-400 border border-blue-100 dark:border-blue-500/20 px-2 py-0.5 rounded font-semibold text-[9px] uppercase tracking-wide">
                                        ${tabNamesMapping[item.originTab]}
                                    </span>
                                ` : ''}
                            </div>
                            <h3 class="text-xs md:text-sm font-semibold text-slate-900 dark:text-white truncate">
                                ${item.name}
                            </h3>
                        </div>
                    </div>
                    
                    <div class="w-full sm:w-auto shrink-0 flex items-center gap-2">
                        <button onclick="copySingleResource(this, '${btoa(encodeURIComponent(item.name))}', '${item.url}')" 
                            class="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 text-[11px] font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3.5 py-2 rounded-lg transition-all active:scale-95 border border-slate-200 dark:border-slate-700" 
                            title="Copy Link">
                            <i class="fa-regular fa-copy text-xs"></i> <span>Copy</span>
                        </button>
                        
                        <a href="${item.url}" target="_blank" class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 text-[11px] font-semibold bg-amber-400 hover:bg-amber-300 text-slate-950 px-4 py-2 rounded-lg shadow-xs transition-all active:scale-95">

        // Single Row Copy Engine with Channel Link
        function copySingleResource(btnElement, encodedName, url) {
            const decodedName = decodeURIComponent(atob(encodedName));
            let formattedText = `📁 *${decodedName}*\n🔗 Link: ${url}\n\n`;
            formattedText += `📢 *Join WhatsApp Channel for Live VU Help:* \n👉 https://whatsapp.com/channel/0029VbAfKscEVccSHYySNP3I\n\n`;
            formattedText += `VU Study LGWT Official`;

            navigator.clipboard.writeText(formattedText).then(() => {
                const originalContent = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="fa-solid fa-check text-emerald-600 dark:text-emerald-400"></i> <span>Copied!</span>`;
                btnElement.classList.add('bg-emerald-50', 'dark:bg-emerald-500/10', 'border-emerald-200', 'dark:border-emerald-500/20', 'text-emerald-700', 'dark:text-emerald-400');

                setTimeout(() => {
                    btnElement.innerHTML = originalContent;
                    btnElement.classList.remove('bg-emerald-50', 'dark:bg-emerald-500/10', 'border-emerald-200', 'dark:border-emerald-500/20', 'text-emerald-700', 'dark:text-emerald-400');
                }, 1500);
            });
        }

        // Bulk Message Compilation
        function compileBulkMessage() {
            if (!currentRenderedItems || currentRenderedItems.length === 0) return "";

            let sectionHeaderName = tabNamesMapping[currentActiveTab].toUpperCase();
            let textMessageBlock = `🎓 *VU STUDY LGWT RESOURCE VAULT* 🎓\n`;
            textMessageBlock += `━━━━━━━━━━━━━━━━━━━━━\n`;
            textMessageBlock += `📂 *CATEGORY: ${sectionHeaderName}*\n`;
            textMessageBlock += `🔢 Total Links: ${currentRenderedItems.length}\n`;
            textMessageBlock += `━━━━━━━━━━━━━━━━━━━━━\n\n`;

            currentRenderedItems.forEach((item, index) => {
                textMessageBlock += `${index + 1}. *${item.name}*\n`;
                textMessageBlock += `🔗 ${item.url}\n`;
                textMessageBlock += `-------------------------------------\n`;
            });

            textMessageBlock += `\n📢 *FOR LATEST VU UPDATES & LIVE HELP* \n`;
            textMessageBlock += `🟢 *Join Our WhatsApp Channel:* \n`;
            textMessageBlock += `🔗 https://whatsapp.com/channel/0029VbAfKscEVccSHYySNP3I\n`;
            textMessageBlock += `━━━━━━━━━━━━━━━━━━━━━\n`;
            textMessageBlock += `🚀 *Prepared with Team LGWT!*`;
            return textMessageBlock;
        }

        function handleBulkAction(actionType) {
            const compiledMessageText = compileBulkMessage();
            if (!compiledMessageText) return;

            if (actionType === 'copy') {
                navigator.clipboard.writeText(compiledMessageText).then(() => {
                    const copyMasterBtn = document.getElementById('master-bulk-copy-btn');
                    const originalBtnHtml = copyMasterBtn.innerHTML;
                    
                    copyMasterBtn.innerHTML = `<i class="fa-solid fa-square-check text-emerald-600"></i> List Copied!`;
                    copyMasterBtn.classList.add('bg-emerald-50', 'text-emerald-900', 'border-emerald-300');

                    setTimeout(() => {
                        copyMasterBtn.innerHTML = originalBtnHtml;
                        copyMasterBtn.classList.remove('bg-emerald-50', 'text-emerald-900', 'border-emerald-300');
                    }, 2000);
                });
            } else if (actionType === 'whatsapp') {
                const whatsappGatewayUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(compiledMessageText)}`;
                window.open(whatsappGatewayUrl, '_blank');
            }
        }

        // Tab Switching Logic
        function switchTab(tabKey) {
            currentActiveTab = tabKey;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-btn-${tabKey}`).classList.add('active');
            
            document.getElementById('vault-search').value = '';
            document.getElementById('tab-navigation-container').classList.remove('opacity-40', 'pointer-events-none');
            
            displayTabContent(mainVaultData[tabKey], false);
        }

        // Search Filter
        function filterVault() {
            const query = document.getElementById('vault-search').value.toLowerCase().trim();
            const tabContainer = document.getElementById('tab-navigation-container');
            
            if (!query) {
                tabContainer.classList.remove('opacity-40', 'pointer-events-none');
                displayTabContent(mainVaultData[currentActiveTab], false);
                return;
            }

            tabContainer.classList.add('opacity-40', 'pointer-events-none');

            let globalCollectedSet = [];
            for (const key in mainVaultData) {
                if (mainVaultData.hasOwnProperty(key)) {
                    mainVaultData[key].forEach(element => {
                        globalCollectedSet.push({ ...element, originTab: key });
                    });
                }
            }

            const filteredResults = globalCollectedSet.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.badge.toLowerCase().includes(query)
            );

            displayTabContent(filteredResults, true);
        }

        // Theme Support
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeUI(false);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (icon && text) {
                if (isDark) {
                    icon.className = 'fa-solid fa-moon text-yellow-300';
                    text.innerText = 'Dark';
                } else {
                    icon.className = 'fa-solid fa-sun text-amber-500';
                    text.innerText = 'Light';
                }
            }
        }

        window.onload = () => {
            initTheme();
            displayTabContent(mainVaultData['mid'], false);
        };
    </script>
</body>
